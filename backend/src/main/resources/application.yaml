spring:
  application:
    name: backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/ecommerce_recipe_db}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  # Set JWT_SECRET to a hex-encoded key from openssl rand -hex 32.
  expiration: 86400000  # 24 hours in milliseconds

server:
  port: 8081
